<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        var canvas = document.getElementById("gameCanvas");
        var ctx = canvas.getContext("2d");

        var snake = [{x: 10, y: 10}];
        var food = {x: 15, y: 15};
        var direction = "RIGHT";
        var gameInterval;

        var cellSize = 20;

        function gameLoop() {
            moveSnake();
            if (checkCollision()) {
                clearInterval(gameInterval);
                alert("Game Over");
                return;
            }
            if (checkFood()) {
                snake.push({x: food.x, y: food.y});
                placeFood();
            }
            draw();
        }

        function moveSnake() {
            var head = Object.assign({}, snake[0]);
            if (direction === "RIGHT") head.x++;
            if (direction === "LEFT") head.x--;
            if (direction === "UP") head.y--;
            if (direction === "DOWN") head.y++;

            snake.unshift(head);
            snake.pop();
        }

        function checkCollision() {
            var head = snake[0];
            if (head.x < 0 || head.y < 0 || head.x >= canvas.width / cellSize || head.y >= canvas.height / cellSize) {
                return true;
            }
            for (var i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return true;
                }
            }
            return false;
        }

        function checkFood() {
            return snake[0].x === food.x && snake[0].y === food.y;
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * (canvas.width / cellSize)),
                y: Math.floor(Math.random() * (canvas.height / cellSize))
            };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw snake
            snake.forEach(function(segment) {
                ctx.fillStyle = "green";
                ctx.fillRect(segment.x * cellSize, segment.y * cellSize, cellSize, cellSize);
            });

            // Draw food
            ctx.fillStyle = "red";
            ctx.fillRect(food.x * cellSize, food.y * cellSize, cellSize, cellSize);
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowUp" && direction !== "DOWN") {
                direction = "UP";
            } else if (event.key === "ArrowDown" && direction !== "UP") {
                direction = "DOWN";
            } else if (event.key === "ArrowLeft" && direction !== "RIGHT") {
                direction = "LEFT";
            } else if (event.key === "ArrowRight" && direction !== "LEFT") {
                direction = "RIGHT";
            }
        });

        // Start the game
        gameInterval = setInterval(gameLoop, 100);
    </script>
</body>
</html>
